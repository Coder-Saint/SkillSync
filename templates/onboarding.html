<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Alchemy - Setup Profile</title>
    <style>
        body { background: linear-gradient(135deg, #a855f7, #6b21a8); color: white; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .onboarding-container { max-width: 700px; margin: 40px auto; padding: 20px; }
        .glass-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        .upload-box { border: 2px dashed rgba(255,255,255,0.5); border-radius: 12px; padding: 30px; margin-bottom: 30px; background: rgba(0,0,0,0.1); text-align: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group label { font-weight: bold; margin-bottom: 8px; display: block; color: #e9d5ff; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border-radius: 8px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: white; font-family: inherit; font-size: 1rem; }
        .input-group textarea { height: 80px; resize: vertical; }
        .btn-primary { background: white; color: #6b21a8; padding: 14px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; width: 100%; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="glass-card">
            <h2 style="margin-top: 0; text-align: center;">Complete Your Profile</h2>
            <p style="color: #ddd; margin-bottom: 30px; text-align: center;">Upload your resume to auto-fill the fields, or enter your details manually.</p>
            <div class="upload-box">
                <p style="margin-top: 0;">1. Select your PDF Resume (Optional)</p>
                <input type="file" id="pdfInput" accept=".pdf" style="margin-bottom: 10px;">
                <button class="btn-secondary" onclick="uploadResume()">Auto-Extract Data</button>
                <p id="status-msg" style="color: #fbcfe8; font-size: 0.9rem; margin-top: 10px;"></p>
            </div>
            <form action="/seeker_dashboard" method="POST">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" name="name" id="nameInput" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Education Level</label>
                        <input type="text" name="education" id="eduInput" placeholder="e.g. B.Tech Computer Science" required>
                    </div>
                </div>
                <div class="input-group" style="margin-bottom: 20px;">
                    <label>Experience Level</label>
                    <input type="text" name="experience" id="expInput" placeholder="e.g. Fresher, 2 Years" required>
                </div>
                <div class="input-group" style="margin-bottom: 30px;">
                    <label>Technical Skills</label>
                    <textarea name="skills" id="skillsArea" placeholder="e.g. Python, Java, React..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Save & Enter Dashboard -> </button>
            </form>
        </div>
    </div>
    <script>
        function uploadResume() {
            const fileInput = document.getElementById('pdfInput');
            const statusMsg = document.getElementById('status-msg');
            if(fileInput.files.length === 0) { statusMsg.innerText = "Please select a file first."; return; }
            statusMsg.innerText = "Parsing PDF... Please wait.";
            let formData = new FormData(); formData.append("resume", fileInput.files[0]);
            fetch('/parse_resume', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if(data.error) { statusMsg.innerText = "Error: " + data.error; } 
                else {
                    statusMsg.innerText = "Success! Review and edit your details below.";
                    document.getElementById('nameInput').value = data.name || '';
                    document.getElementById('eduInput').value = data.education || '';
                    document.getElementById('expInput').value = data.experience || '';
                    document.getElementById('skillsArea').value = data.skills || '';
                }
            })
            .catch(error => { statusMsg.innerText = "Server error occurred."; });
        }
    </script>
</body>
</html>
