<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Alchemy - Login</title>
    <style>
        body { background: linear-gradient(135deg, #f5f3ff, #ddd6fe); color: #1f2937; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .login-container { max-width: 400px; margin: 100px auto; text-align: center; padding: 20px; }
        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #9333ea, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group input[type="email"], .input-group input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; box-sizing: border-box; border: 1px solid rgba(0, 0, 0, 0.1); background: rgba(255, 255, 255, 0.9); color: #333; margin-top: 5px; font-size: 1rem; }
        .role-selector { display: flex; gap: 20px; margin-top: 8px; }
        .role-selector label { cursor: pointer; font-weight: 500; color: #4b5563; display: flex; align-items: center; gap: 5px; }
        .btn-primary { background: linear-gradient(90deg, #9333ea, #7e22ce); color: white; padding: 12px 24px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: opacity 0.3s; }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="glass-card">
            <h2 style="font-size: 2rem; margin-top: 0;">Skill<span class="gradient-text">Alchemy</span></h2>
            <p style="margin-bottom: 2rem; color: #4b5563;">Sign in to your account</p>
            <form action="/login_action" method="POST">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>I am a:</label>
                    <div class="role-selector">
                        <label><input type="radio" name="role" value="seeker" checked> Job Seeker</label>
                        <label><input type="radio" name="role" value="recruiter"> Recruiter</label>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Continue</button>
            </form>
        </div>
    </div>
</body>
</html>
